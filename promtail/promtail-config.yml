server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: docker-containers
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
    relabel_configs:
      # Extract container name and remove leading slash '/'
      - source_labels: ['__meta_docker_container_name']
        regex: '/(.*)'
        target_label: 'container'

      # Keep only attendance system containers
      - source_labels: ['container']
        regex: 'attendance_.*'
        action: keep

      # Do not scrape promtail or loki to avoid log recursion / spam
      - source_labels: ['container']
        regex: 'attendance_(promtail|loki)'
        action: drop

      # Map docker compose service label to 'service'
      - source_labels: ['__meta_docker_container_label_com_docker_compose_service']
        target_label: 'service'

      # Capture stdout / stderr stream
      - source_labels: ['__meta_docker_container_log_stream']
        target_label: 'stream'

      # Set job label
      - target_label: 'job'
        replacement: 'docker'
