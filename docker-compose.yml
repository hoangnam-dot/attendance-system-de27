services:
  # 1. MySQL Database Service
  mysql:
    image: mysql:8.0
    container_name: attendance_mysql
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME:-attendance_db}
      MYSQL_USER: ${DB_USER:-attendance_user}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      TZ: ${TZ:-Asia/Ho_Chi_Minh}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$${MYSQL_ROOT_PASSWORD} || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 15s
    networks:
      - attendance_net

  # 2. Node.js Express Application Service
  app:
    build:
      context: ./app
      dockerfile: Dockerfile
    container_name: attendance_app
    restart: unless-stopped
    environment:
      PORT: 3000
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-attendance_db}
      DB_USER: ${DB_USER:-attendance_user}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      NODE_ENV: ${NODE_ENV:-production}
      TZ: ${TZ:-Asia/Ho_Chi_Minh}
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - attendance_net

  # 3. phpMyAdmin Management Tool
  phpmyadmin:
    image: phpmyadmin:5.2
    container_name: attendance_phpmyadmin
    restart: unless-stopped
    ports:
      - "${PMA_EXTERNAL_PORT:-8080}:80"
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      PMA_USER: root
      PMA_PASSWORD: ${DB_ROOT_PASSWORD}
      UPLOAD_LIMIT: 64M
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - attendance_net

  # 4. Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: attendance_nginx
    restart: unless-stopped
    ports:
      - "${APP_EXTERNAL_PORT:-80}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - attendance_net

volumes:
  mysql_data:
    name: attendance_mysql_data

networks:
  attendance_net:
    name: attendance_network
    driver: bridge
