services:
  # 1. MySQL Database Service
  mysql:
    image: mysql:8.0
    container_name: attendance_mysql
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME:-attendance_db}
      MYSQL_USER: ${DB_USER:-attendance_user}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_EXPORTER_PASSWORD: ${MYSQL_EXPORTER_PASSWORD}
      TZ: ${TZ:-Asia/Ho_Chi_Minh}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
      - ./database/init-exporter.sh:/docker-entrypoint-initdb.d/02-init-exporter.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$${MYSQL_ROOT_PASSWORD} || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 15s
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - db_net

  # 2. Node.js Express Application Service
  app:
    build:
      context: ./app
      dockerfile: Dockerfile
    container_name: attendance_app
    restart: unless-stopped
    environment:
      PORT: 3000
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-attendance_db}
      DB_USER: ${DB_USER:-attendance_user}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      NODE_ENV: ${NODE_ENV:-production}
      TZ: ${TZ:-Asia/Ho_Chi_Minh}
    depends_on:
      mysql:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - web_net
      - db_net

  # 3. phpMyAdmin Management Tool (Bound to localhost)
  phpmyadmin:
    image: phpmyadmin:5.2
    container_name: attendance_phpmyadmin
    restart: unless-stopped
    ports:
      - "127.0.0.1:${PMA_EXTERNAL_PORT:-8080}:80"
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      PMA_USER: root
      PMA_PASSWORD: ${DB_ROOT_PASSWORD}
      UPLOAD_LIMIT: 64M
    depends_on:
      mysql:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - db_net

  # 4. Nginx Reverse Proxy (Public Entrypoint)
  nginx:
    image: nginx:alpine
    container_name: attendance_nginx
    restart: unless-stopped
    ports:
      - "${APP_EXTERNAL_PORT:-80}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - web_net

  # 5. cAdvisor Container Monitoring
  cadvisor:
    image: ghcr.io/google/cadvisor:0.60.6
    container_name: attendance_cadvisor
    restart: unless-stopped
    privileged: true
    devices:
      - /dev/kmsg
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    networks:
      - monitoring_net

  # 6. NGINX Prometheus Exporter
  nginx-exporter:
    image: nginx/nginx-prometheus-exporter:1.5.3
    container_name: attendance_nginx_exporter
    restart: unless-stopped
    command:
      - -nginx.scrape-uri=http://nginx:8080/stub_status
    depends_on:
      - nginx
    security_opt:
      - no-new-privileges:true
    networks:
      - web_net
      - monitoring_net

  # 7. MySQL Prometheus Exporter
  mysql-exporter:
    image: prom/mysqld-exporter:v0.20.0
    container_name: attendance_mysql_exporter
    restart: unless-stopped
    command:
      - --mysqld.address=mysql:3306
      - --mysqld.username=exporter
    environment:
      MYSQLD_EXPORTER_PASSWORD: ${MYSQL_EXPORTER_PASSWORD}
    depends_on:
      mysql:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    networks:
      - db_net
      - monitoring_net

  # 8. Prometheus Monitoring Server (Bound to localhost)
  prometheus:
    image: prom/prometheus:v3.15.1
    container_name: attendance_prometheus
    restart: unless-stopped
    ports:
      - "127.0.0.1:${PROMETHEUS_EXTERNAL_PORT:-9090}:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
    depends_on:
      - cadvisor
      - nginx-exporter
      - mysql-exporter
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - monitoring_net

  # 9. Grafana Visualization & Dashboard (Bound to localhost)
  grafana:
    image: grafana/grafana:13.2.4
    container_name: attendance_grafana
    restart: unless-stopped
    ports:
      - "127.0.0.1:${GRAFANA_EXTERNAL_PORT:-3001}:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
    depends_on:
      - prometheus
      - loki
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - monitoring_net

  # 10. Loki Centralized Log Store (Bound to localhost)
  loki:
    image: grafana/loki:3.6.11
    container_name: attendance_loki
    restart: unless-stopped
    command: -config.file=/etc/loki/loki-config.yml
    ports:
      - "127.0.0.1:3100:3100"
    volumes:
      - ./loki/loki-config.yml:/etc/loki/loki-config.yml:ro
      - loki_data:/loki
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - monitoring_net

  # 11. Promtail Log Collector & Forwarder
  promtail:
    image: grafana/promtail:3.6.11
    container_name: attendance_promtail
    restart: unless-stopped
    command: -config.file=/etc/promtail/promtail-config.yml
    volumes:
      - ./promtail/promtail-config.yml:/etc/promtail/promtail-config.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
    depends_on:
      - loki
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - monitoring_net

volumes:
  mysql_data:
    name: attendance_mysql_data
  prometheus_data:
    name: attendance_prometheus_data
  grafana_data:
    name: attendance_grafana_data
  loki_data:
    name: attendance_loki_data

networks:
  web_net:
    name: attendance_web_net
    driver: bridge
  db_net:
    name: attendance_db_net
    driver: bridge
  monitoring_net:
    name: attendance_monitoring_net
    driver: bridge
